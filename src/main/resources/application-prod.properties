# Activate with SPRING_PROFILES_ACTIVE=prod on the host.
# Every value below comes from an environment variable the host provides,
# so no secret or environment-specific value is committed to the repo.

# Most hosts (Render, Railway, etc.) inject PORT; Spring needs server.port.
server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# Serve the copied React build as the site itself.
spring.web.resources.static-locations=classpath:/static/
