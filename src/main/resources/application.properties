spring.config.import=optional:file:./application-local.properties
# LootVault application configuration
spring.application.name=LootVaultProject

# --- Database connection (matches docker-compose.yaml) ---
# Port 5433, not 5432 — your machine has a native Postgres install already
# occupying 5432, so Docker's container is remapped to avoid the conflict.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/lootvault}
spring.datasource.username=${DB_USERNAME:lootvault}
spring.datasource.password=${DB_PASSWORD:}

# --- JPA/Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
server.port=8081
